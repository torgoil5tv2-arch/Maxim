<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 337" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <!-- Multi-stage Neon Glow Filter -->
    <filter id="intenseNeon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="glow1" />
      <feGaussianBlur stdDeviation="5" result="glow2" />
      <feGaussianBlur stdDeviation="12" result="glow3" />
      <feMerge>
        <feMergeNode in="glow3" />
        <feMergeNode in="glow2" />
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="ambientLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="337" fill="#111111"/>
  <rect width="600" height="337" fill="url(#grid)"/>

  <!-- Ambient Light Reflection on Acrylic / Wall -->
  <ellipse cx="300" cy="155" rx="160" ry="45" fill="rgba(255, 255, 255, 0.08)" filter="url(#ambientLight)"/>

  <!-- Tech HUD Frame -->
  <g stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="none">
    <path d="M 20 35 L 20 20 L 35 20" />
    <path d="M 580 35 L 580 20 L 565 20" />
    <path d="M 20 302 L 20 317 L 35 317" />
    <path d="M 580 302 L 580 317 L 565 317" />
  </g>
  <text x="35" y="32" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" letter-spacing="2">MONO // LED NEON SERIES</text>
  <text x="565" y="32" text-anchor="end" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" letter-spacing="1">DIMMER CONTROL • USB 5V</text>

  <!-- Dark Acrylic Base (Pedestal) -->
  <g transform="translate(180, 230)">
    <!-- Base Plate -->
    <polygon points="0,25 240,25 220,40 20,40" fill="#1a1a1a" stroke="#333" stroke-width="1.5"/>
    <polygon points="20,40 220,40 220,46 20,46" fill="#141414" stroke="#222" stroke-width="1"/>
    <!-- Acrylic vertical slots holding blade -->
    <rect x="50" y="5" width="10" height="22" rx="2" fill="#222" stroke="#444" stroke-width="1"/>
    <rect x="180" y="5" width="10" height="22" rx="2" fill="#222" stroke="#444" stroke-width="1"/>
    <!-- Wire to Dimmer -->
    <path d="M 220 35 Q 260 38 290 60" fill="none" stroke="#333" stroke-width="2"/>
  </g>

  <!-- Neon Blade (Katana / Cyber Saber) -->
  <g transform="rotate(-15 300 150)">
    <!-- Acrylic Backplate contour (transparent edge) -->
    <path d="M 80 150 L 460 150 Q 520 148 535 130 Q 515 125 440 128 L 80 135 Z" fill="#161616" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

    <!-- Handle (Tsuka) -->
    <g transform="translate(85, 131)">
      <!-- Grip Body -->
      <rect x="0" y="2" width="115" height="18" rx="4" fill="#0d0d0d" stroke="#333" stroke-width="1.5"/>
      <!-- Wrap (Tsukaito Pattern) -->
      <line x1="18" y1="2" x2="28" y2="20" stroke="#555" stroke-width="2"/>
      <line x1="38" y1="2" x2="48" y2="20" stroke="#555" stroke-width="2"/>
      <line x1="58" y1="2" x2="68" y2="20" stroke="#555" stroke-width="2"/>
      <line x1="78" y1="2" x2="88" y2="20" stroke="#555" stroke-width="2"/>
      <line x1="98" y1="2" x2="108" y2="20" stroke="#555" stroke-width="2"/>
      <!-- Guard (Tsuba) -->
      <rect x="115" y="-3" width="7" height="28" rx="2" fill="#262626" stroke="#fff" stroke-width="1"/>
      <!-- Pommel (Kashira) -->
      <rect x="-6" y="1" width="8" height="20" rx="3" fill="#222" stroke="#444" stroke-width="1"/>
    </g>

    <!-- Glowing Neon Tube (Active Blade) -->
    <g filter="url(#intenseNeon)">
      <!-- Main Core (Pure Solid White) -->
      <path d="M 210 140 L 470 140 Q 510 138 525 125 Q 490 134 440 135 L 210 135 Z" fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
      <!-- Plasma Beam Line -->
      <line x1="210" y1="137.5" x2="490" y2="137.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Title / Product Identity -->
  <text x="300" y="255" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="20" letter-spacing="6" filter="url(#intenseNeon)">CYBER BLADE</text>
  <text x="300" y="278" text-anchor="middle" fill="#888888" font-family="monospace" font-size="10" letter-spacing="2">FLEXIBLE SILICONE LED NEON // 50000 HOURS</text>

  <!-- Dimmer Pill / Tag -->
  <rect x="220" y="295" width="160" height="22" rx="11" fill="#1b1b1b" stroke="#333" stroke-width="1"/>
  <text x="300" y="310" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="1">💡 ДІММЕР В КОМПЛЕКТІ</text>
</svg>
