<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 337" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>

    <!-- Wall Glow Gradients -->
    <linearGradient id="leftWallLight" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="rightWallLight" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="floorLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="70%" stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Multi-stage Neon Glow Filter -->
    <filter id="lampGlow" x="-50%" y="-20%" width="200%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow1"/>
      <feGaussianBlur stdDeviation="8" result="glow2"/>
      <feMerge>
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="337" fill="#111111"/>
  <rect width="600" height="337" fill="url(#grid)"/>

  <!-- Corner Perspective Room Layout -->
  <!-- Left Wall -->
  <polygon points="40,20 300,50 300,270 40,317" fill="#141414" stroke="#222" stroke-width="1"/>
  <!-- Right Wall -->
  <polygon points="300,50 560,20 560,317 300,270" fill="#171717" stroke="#222" stroke-width="1"/>
  <!-- Floor Section -->
  <polygon points="40,317 300,270 560,317 300,337" fill="#0d0d0d"/>

  <!-- Light Wash Cast on Left Wall -->
  <polygon points="120,38 300,50 300,270 120,305" fill="url(#leftWallLight)"/>
  <!-- Light Wash Cast on Right Wall -->
  <polygon points="300,50 480,38 480,305 300,270" fill="url(#rightWallLight)"/>
  <!-- Floor Pool of Light -->
  <ellipse cx="300" cy="275" rx="75" ry="18" fill="url(#floorLight)"/>

  <!-- Tech HUD Frame -->
  <g stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="none">
    <path d="M 20 35 L 20 20 L 35 20" />
    <path d="M 580 35 L 580 20 L 565 20" />
    <path d="M 20 302 L 20 317 L 35 317" />
    <path d="M 580 302 L 580 317 L 565 317" />
  </g>
  <text x="35" y="32" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" letter-spacing="2">MONO // SMART AMBIENT LIGHT</text>
  <text x="565" y="32" text-anchor="end" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" letter-spacing="1">RGBIC PRO • 140CM</text>

  <!-- Corner Floor Lamp Structure -->
  <!-- Lamp Base (Two perpendicular feet into the corner) -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <line x1="300" y1="272" x2="250" y2="280"/>
    <line x1="300" y1="272" x2="350" y2="280"/>
  </g>
  <!-- Main Vertical Rod (Glowing LED Strip) -->
  <!-- Dark Backspine of lamp -->
  <line x1="300" y1="65" x2="300" y2="272" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Intense White Glowing Tube -->
  <line x1="300" y1="65" x2="300" y2="270" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" filter="url(#lampGlow)"/>

  <!-- Music Equalizer Sync Graphic (Right Side) -->
  <g transform="translate(420, 110)">
    <rect x="0" y="0" width="110" height="95" rx="8" fill="#111111" stroke="#333" stroke-width="1"/>
    <text x="55" y="24" text-anchor="middle" fill="#888" font-family="'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="1">MUSIC SYNC</text>
    
    <!-- Equalizer Bars -->
    <g transform="translate(18, 38)" fill="#ffffff" filter="url(#lampGlow)">
      <rect x="0" y="22" width="6" height="20" rx="2"/>
      <rect x="11" y="10" width="6" height="32" rx="2"/>
      <rect x="22" y="2" width="6" height="40" rx="2"/>
      <rect x="33" y="15" width="6" height="27" rx="2"/>
      <rect x="44" y="6" width="6" height="36" rx="2"/>
      <rect x="55" y="18" width="6" height="24" rx="2"/>
      <rect x="66" y="26" width="6" height="16" rx="2"/>
    </g>
  </g>

  <!-- Smart Controls Graphic (Left Side) -->
  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="110" height="95" rx="8" fill="#111111" stroke="#333" stroke-width="1"/>
    <text x="55" y="24" text-anchor="middle" fill="#888" font-family="'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="1">APP CONTROL</text>
    <!-- Bluetooth Icon -->
    <g transform="translate(45, 38)" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 10 5 L 10 35 L 20 25 L 2 13 L 20 13 L 10 5 Z"/>
    </g>
    <text x="55" y="84" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="8">16M COLORS</text>
  </g>

  <!-- Footer Tag -->
  <rect x="210" y="295" width="180" height="22" rx="11" fill="#1b1b1b" stroke="#333" stroke-width="1"/>
  <text x="300" y="310" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="1">🎵 СИНХРОНІЗАЦІЯ З БІТОМ</text>
</svg>
