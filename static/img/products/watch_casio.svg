<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 337" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <filter id="lcdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="casioSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#363636"/>
      <stop offset="30%" stop-color="#242424"/>
      <stop offset="70%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#101010"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="337" fill="#111111"/>
  <rect width="600" height="337" fill="url(#grid)"/>

  <!-- Tech HUD Frame -->
  <g stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="none">
    <path d="M 20 35 L 20 20 L 35 20" />
    <path d="M 580 35 L 580 20 L 565 20" />
    <path d="M 20 302 L 20 317 L 35 317" />
    <path d="M 580 302 L 580 317 L 565 317" />
  </g>
  <text x="35" y="32" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" letter-spacing="2">MONO // CASIO CYBER ROYALE</text>
  <text x="565" y="32" text-anchor="end" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" letter-spacing="1">MOD. AE-1200 • NEGATIVE LCD</text>

  <!-- Tactical Strap (Top and Bottom) -->
  <g transform="translate(300, 168)" fill="#1c1c1c" stroke="#333" stroke-width="1.5">
    <rect x="-45" y="-140" width="90" height="45" rx="2"/>
    <rect x="-45" y="95" width="90" height="45" rx="2"/>
    <!-- Webbing Texture Lines -->
    <line x1="-30" y1="-140" x2="-30" y2="-95" stroke="#2a2a2a" stroke-width="2"/>
    <line x1="0" y1="-140" x2="0" y2="-95" stroke="#2a2a2a" stroke-width="2"/>
    <line x1="30" y1="-140" x2="30" y2="-95" stroke="#2a2a2a" stroke-width="2"/>
    <line x1="-30" y1="95" x2="-30" y2="140" stroke="#2a2a2a" stroke-width="2"/>
    <line x1="0" y1="95" x2="0" y2="140" stroke="#2a2a2a" stroke-width="2"/>
    <line x1="30" y1="95" x2="30" y2="140" stroke="#2a2a2a" stroke-width="2"/>
  </g>

  <!-- Main Watch Body (Casio Royale Octagonal Case) -->
  <g transform="translate(300, 168)">
    <!-- Shadow -->
    <polygon points="-80,-70 -60,-95 60,-95 80,-70 80,70 60,95 -60,95 -80,70" fill="#000000" opacity="0.6" transform="translate(6, 6)"/>

    <!-- Pushers (4 Metal Buttons) -->
    <!-- Top-Left -->
    <rect x="-89" y="-55" width="10" height="18" rx="2" fill="#252525" stroke="#555" stroke-width="1"/>
    <!-- Bottom-Left -->
    <rect x="-89" y="37" width="10" height="18" rx="2" fill="#252525" stroke="#555" stroke-width="1"/>
    <!-- Top-Right -->
    <rect x="79" y="-55" width="10" height="18" rx="2" fill="#252525" stroke="#555" stroke-width="1"/>
    <!-- Bottom-Right -->
    <rect x="79" y="37" width="10" height="18" rx="2" fill="#252525" stroke="#555" stroke-width="1"/>

    <!-- Octagonal Stainless Steel Beveled Case -->
    <polygon points="-80,-68 -58,-92 58,-92 80,-68 80,68 58,92 -58,92 -80,68" fill="url(#casioSteel)" stroke="#444" stroke-width="2"/>

    <!-- 4 Bezel Screws in Corners -->
    <circle cx="-50" cy="-72" r="3" fill="#222" stroke="#666" stroke-width="1"/>
    <circle cx="50" cy="-72" r="3" fill="#222" stroke="#666" stroke-width="1"/>
    <circle cx="-50" cy="72" r="3" fill="#222" stroke="#666" stroke-width="1"/>
    <circle cx="50" cy="72" r="3" fill="#222" stroke="#666" stroke-width="1"/>

    <!-- Case Top Engraving -->
    <text x="0" y="-76" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="8" letter-spacing="2">CASIO</text>
    <text x="0" y="82" text-anchor="middle" fill="#888888" font-family="monospace" font-size="7" letter-spacing="1">ILLUMINATOR • 100M</text>

    <!-- Deep Black Polarized Negative LCD Display -->
    <rect x="-62" y="-60" width="124" height="120" rx="8" fill="#050505" stroke="#222" stroke-width="1.5"/>

    <!-- Inner Display Compartments -->
    <!-- Top Left: Analog Radar Dial -->
    <g transform="translate(-36, -32)">
      <circle cx="0" cy="0" r="20" fill="#0d0d0d" stroke="#333" stroke-width="1"/>
      <!-- Crosshairs -->
      <line x1="-18" y1="0" x2="18" y2="0" stroke="#444" stroke-width="0.8"/>
      <line x1="0" y1="-18" x2="0" y2="18" stroke="#444" stroke-width="0.8"/>
      <!-- Radar Hands (White High Contrast) -->
      <line x1="0" y1="0" x2="-8" y2="-10" stroke="#ffffff" stroke-width="2" filter="url(#lcdGlow)"/>
      <line x1="0" y1="0" x2="12" y2="4" stroke="#ffffff" stroke-width="1.5" filter="url(#lcdGlow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#fff"/>
    </g>

    <!-- Top Right: World Map Segment -->
    <g transform="translate(18, -32)">
      <rect x="-30" y="-18" width="60" height="36" rx="4" fill="#0a0a0a" stroke="#262626" stroke-width="1"/>
      <text x="0" y="-10" text-anchor="middle" fill="#666" font-family="monospace" font-size="6">WORLD TIME</text>
      <!-- Stylized World Map Pixel Grids -->
      <path d="M -22 -4 Q -16 -8 -10 -4 L -14 6 Z" fill="#ffffff" opacity="0.6"/>
      <path d="M -6 -6 Q 0 -9 8 -5 Q 12 4 4 8 Z" fill="#ffffff" opacity="0.8"/>
      <path d="M 12 -4 Q 18 -6 22 0 Q 18 6 12 4 Z" fill="#ffffff" opacity="0.6"/>
      <!-- Active Zone Blinking Marker -->
      <circle cx="4" cy="-3" r="2" fill="#ffffff" filter="url(#lcdGlow)"/>
    </g>

    <!-- Middle Divider Line -->
    <line x1="-56" y1="-8" x2="56" y2="-8" stroke="#222" stroke-width="1"/>

    <!-- Bottom: Main High-Contrast Negative Digital Clock -->
    <g transform="translate(0, 32)">
      <!-- Day / Date Bar -->
      <text x="-48" y="-22" fill="#888888" font-family="monospace" font-size="8">THU</text>
      <text x="48" y="-22" text-anchor="end" fill="#888888" font-family="monospace" font-size="8">11-05</text>
      
      <!-- Big Digital Digits (22:45) -->
      <text x="-8" y="10" text-anchor="end" fill="#ffffff" font-family="'Inter', monospace" font-weight="900" font-size="28" letter-spacing="-1" filter="url(#lcdGlow)">22:45</text>
      <!-- Seconds & AM/PM -->
      <text x="12" y="10" fill="#ffffff" font-family="'Inter', monospace" font-weight="800" font-size="16" filter="url(#lcdGlow)">38</text>
      <text x="36" y="8" fill="#777" font-family="monospace" font-size="8">SEC</text>
    </g>
  </g>

  <!-- Left / Right Specs Labels -->
  <g transform="translate(45, 140)">
    <text x="0" y="0" fill="#666" font-family="monospace" font-size="10">MODULE:</text>
    <text x="0" y="16" fill="#ccc" font-family="'Inter', sans-serif" font-weight="700" font-size="11">CASIO 3299</text>
    <text x="0" y="32" fill="#888" font-family="'Inter', sans-serif" font-size="10">10 YEAR BATTERY</text>
  </g>

  <g transform="translate(485, 140)">
    <text x="0" y="0" fill="#666" font-family="monospace" font-size="10">MOD FEATURES:</text>
    <text x="0" y="16" fill="#ccc" font-family="'Inter', sans-serif" font-weight="700" font-size="11">HYDRO INVERT</text>
    <text x="0" y="32" fill="#888" font-family="'Inter', sans-serif" font-size="10">STEEL ROYALE</text>
  </g>

  <!-- Footer Tag -->
  <rect x="210" y="295" width="180" height="22" rx="11" fill="#1b1b1b" stroke="#333" stroke-width="1"/>
  <text x="300" y="310" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="1">⌚ НЕГАТИВНИЙ ДИСПЛЕЙ</text>
</svg>
