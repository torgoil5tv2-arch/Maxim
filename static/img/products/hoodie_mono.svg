<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 337" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <filter id="puffGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="fabricGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="50%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="337" fill="#111111"/>
  <rect width="600" height="337" fill="url(#grid)"/>

  <!-- Tech HUD Frame -->
  <g stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="none">
    <path d="M 20 35 L 20 20 L 35 20" />
    <path d="M 580 35 L 580 20 L 565 20" />
    <path d="M 20 302 L 20 317 L 35 317" />
    <path d="M 580 302 L 580 317 L 565 317" />
  </g>
  <text x="35" y="32" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" letter-spacing="2">MONO // CUSTOM STREETWEAR</text>
  <text x="565" y="32" text-anchor="end" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" letter-spacing="1">380 GSM • OVERSIZE FIT</text>

  <!-- Heavyweight Oversize Hoodie Silhouette -->
  <g transform="translate(130, 48)">
    <!-- Shadow -->
    <path d="M 170 12 L 210 32 L 285 62 L 315 130 L 290 140 L 275 88 L 275 220 L 65 220 L 65 88 L 50 140 L 25 130 L 55 62 L 130 32 Z" fill="#000000" opacity="0.5" transform="translate(6, 6)"/>

    <!-- Sleeves & Main Torso -->
    <path d="M 170 12 
             L 210 32 
             L 295 65 
             L 322 138 
             L 290 148 
             L 272 90 
             L 272 222 
             L 68 222 
             L 68 90 
             L 50 148 
             L 18 138 
             L 45 65 
             L 130 32 Z" 
          fill="url(#fabricGrad)" stroke="#3a3a3a" stroke-width="1.8"/>

    <!-- Ribbed Cuffs and Hem -->
    <!-- Left Cuff -->
    <polygon points="18,138 50,148 48,158 16,148" fill="#141414" stroke="#444" stroke-width="1"/>
    <!-- Right Cuff -->
    <polygon points="290,148 322,138 324,148 292,158" fill="#141414" stroke="#444" stroke-width="1"/>
    <!-- Bottom Hem Band -->
    <rect x="68" y="210" width="204" height="16" fill="#161616" stroke="#333" stroke-width="1"/>
    <!-- Ribbing texture lines on hem -->
    <line x1="100" y1="210" x2="100" y2="226" stroke="#222" stroke-width="1"/>
    <line x1="135" y1="210" x2="135" y2="226" stroke="#222" stroke-width="1"/>
    <line x1="170" y1="210" x2="170" y2="226" stroke="#222" stroke-width="1"/>
    <line x1="205" y1="210" x2="205" y2="226" stroke="#222" stroke-width="1"/>
    <line x1="240" y1="210" x2="240" y2="226" stroke="#222" stroke-width="1"/>

    <!-- Kangaroo Pocket -->
    <path d="M 100 152 L 240 152 L 255 204 L 85 204 Z" fill="#1c1c1c" stroke="#383838" stroke-width="1.5"/>
    <!-- Pocket Side Openings -->
    <line x1="100" y1="152" x2="85" y2="204" stroke="#555" stroke-width="2"/>
    <line x1="240" y1="152" x2="255" y2="204" stroke="#555" stroke-width="2"/>

    <!-- Deep Double Hood Shape -->
    <path d="M 125 32 
             C 115 15, 140 -5, 170 -5 
             C 200 -5, 225 15, 215 32 
             C 195 46, 145 46, 125 32 Z" 
          fill="#1f1f1f" stroke="#444" stroke-width="1.8"/>
    <!-- Hood Inner Depth / Opening -->
    <path d="M 142 28 C 150 12, 190 12, 198 28 C 180 38, 160 38, 142 28 Z" fill="#0c0c0c" stroke="#2a2a2a" stroke-width="1.2"/>
    <!-- Drawstrings / Thick Cords -->
    <line x1="160" y1="35" x2="158" y2="72" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="180" y1="35" x2="182" y2="68" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <!-- Cord Metal Tips -->
    <rect x="156" y="70" width="4" height="6" fill="#888"/>
    <rect x="180" y="66" width="4" height="6" fill="#888"/>

    <!-- MONO DISTORTION Chest Artwork (High Contrast Graphic) -->
    <g transform="translate(170, 105)" filter="url(#puffGlow)">
      <!-- Geometric Cyber Distort Shape -->
      <polygon points="-40,-18 40,-18 35,-6 -35,-6" fill="#ffffff"/>
      <text x="0" y="10" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="16" letter-spacing="3">MONO.DROP</text>
      <text x="0" y="24" text-anchor="middle" fill="#aaaaaa" font-family="monospace" font-size="8" letter-spacing="4">// DISTORTION</text>
      <!-- Horizontal glitch bars -->
      <line x1="-35" y1="28" x2="35" y2="28" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="-20" y1="31" x2="20" y2="31" stroke="#ffffff" stroke-width="1"/>
    </g>
  </g>

  <!-- Spec Tag Icons (Left & Right) -->
  <g transform="translate(45, 140)">
    <text x="0" y="0" fill="#666" font-family="monospace" font-size="10">FABRIC:</text>
    <text x="0" y="16" fill="#ccc" font-family="'Inter', sans-serif" font-weight="700" font-size="11">3-THREAD FLEECE</text>
    <text x="0" y="32" fill="#888" font-family="'Inter', sans-serif" font-size="10">85% COTTON</text>
  </g>

  <g transform="translate(485, 140)">
    <text x="0" y="0" fill="#666" font-family="monospace" font-size="10">PRINT TYPE:</text>
    <text x="0" y="16" fill="#ccc" font-family="'Inter', sans-serif" font-weight="700" font-size="11">3D PUFF PRINT</text>
    <text x="0" y="32" fill="#888" font-family="'Inter', sans-serif" font-size="10">+ REFLECTIVE</text>
  </g>

  <!-- Footer Tag -->
  <rect x="220" y="295" width="160" height="22" rx="11" fill="#1b1b1b" stroke="#333" stroke-width="1"/>
  <text x="300" y="310" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="1">👕 OVERSIZE BOXY FIT</text>
</svg>
