<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 337" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <filter id="lumeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="50%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="337" fill="#111111"/>
  <rect width="600" height="337" fill="url(#grid)"/>

  <!-- Tech HUD Frame -->
  <g stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="none">
    <path d="M 20 35 L 20 20 L 35 20" />
    <path d="M 580 35 L 580 20 L 565 20" />
    <path d="M 20 302 L 20 317 L 35 317" />
    <path d="M 580 302 L 580 317 L 565 317" />
  </g>
  <text x="35" y="32" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" letter-spacing="2">MONO // SEIKO MOD CUSTOM</text>
  <text x="565" y="32" text-anchor="end" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" letter-spacing="1">CAL. NH35 • SAPPHIRE 10 ATM</text>

  <!-- Steel Bracelet (Extending Top and Bottom) -->
  <g transform="translate(300, 168)" fill="#1c1c1c" stroke="#333" stroke-width="1.5">
    <!-- Top Links -->
    <rect x="-42" y="-140" width="84" height="26" rx="3"/>
    <rect x="-40" y="-115" width="80" height="26" rx="3"/>
    <rect x="-38" y="-90" width="76" height="26" rx="3"/>
    <!-- Bottom Links -->
    <rect x="-38" y="64" width="76" height="26" rx="3"/>
    <rect x="-40" y="89" width="80" height="26" rx="3"/>
    <rect x="-42" y="114" width="84" height="26" rx="3"/>
  </g>

  <!-- Main Watch Case -->
  <g transform="translate(300, 168)">
    <!-- Shadow -->
    <circle cx="5" cy="5" r="85" fill="#000000" opacity="0.6"/>

    <!-- Lugs (Case Extrusions) -->
    <polygon points="-48,-95 -32,-60 32,-60 48,-95" fill="url(#steelGrad)" stroke="#3a3a3a" stroke-width="1.5"/>
    <polygon points="-48,95 -32,60 32,60 48,95" fill="url(#steelGrad)" stroke="#3a3a3a" stroke-width="1.5"/>

    <!-- Screw-down Crown with Grips -->
    <rect x="80" y="-12" width="16" height="24" rx="3" fill="#252525" stroke="#555" stroke-width="1.5"/>
    <line x1="84" y1="-10" x2="84" y2="10" stroke="#777" stroke-width="1"/>
    <line x1="88" y1="-10" x2="88" y2="10" stroke="#777" stroke-width="1"/>
    <line x1="92" y1="-10" x2="92" y2="10" stroke="#777" stroke-width="1"/>

    <!-- Main Outer Round Case (40mm PVD 316L) -->
    <circle cx="0" cy="0" r="82" fill="url(#steelGrad)" stroke="#444" stroke-width="2"/>

    <!-- Fluted / Serrated Diver Bezel Ring -->
    <circle cx="0" cy="0" r="76" fill="url(#bezelGrad)" stroke="#333" stroke-width="2"/>
    <!-- Bezel Marker Notches -->
    <g stroke="#ffffff" stroke-width="1.5" opacity="0.7">
      <line x1="0" y1="-76" x2="0" y2="-70"/>
      <line x1="38" y1="-66" x2="35" y2="-61"/>
      <line x1="66" y1="-38" x2="61" y2="-35"/>
      <line x1="76" y1="0" x2="70" y2="0"/>
      <line x1="66" y1="38" x2="61" y2="35"/>
      <line x1="38" y1="66" x2="35" y2="61"/>
      <line x1="0" y1="76" x2="0" y2="70"/>
      <line x1="-38" y1="66" x2="-35" y2="61"/>
      <line x1="-66" y1="38" x2="-61" y2="35"/>
      <line x1="-76" y1="0" x2="-70" y2="0"/>
      <line x1="-66" y1="-38" x2="-61" y2="-35"/>
      <line x1="-38" y1="-66" x2="-35" y2="-61"/>
      <!-- Top Bezel Triangle (12 o'clock dive mark) -->
      <polygon points="0,-74 -5,-67 5,-67" fill="#ffffff" stroke="none"/>
    </g>

    <!-- Deep Black Sunburst Dial Interior -->
    <circle cx="0" cy="0" r="62" fill="#080808" stroke="#222" stroke-width="1.5"/>

    <!-- Hour Markers (Luminescent Applied Indices) -->
    <g fill="#ffffff" filter="url(#lumeGlow)">
      <!-- 12, 3, 6, 9 Cardinal Markers -->
      <rect x="-4" y="-56" width="8" height="12" rx="1"/>
      <rect x="44" y="-4" width="12" height="8" rx="1"/>
      <rect x="-4" y="44" width="8" height="12" rx="1"/>
      <rect x="-56" y="-4" width="12" height="8" rx="1"/>
      <!-- Round Dots for other hours -->
      <circle cx="28" cy="-48" r="4"/>
      <circle cx="48" cy="-28" r="4"/>
      <circle cx="48" cy="28" r="4"/>
      <circle cx="28" cy="48" r="4"/>
      <circle cx="-28" cy="48" r="4"/>
      <circle cx="-48" cy="28" r="4"/>
      <circle cx="-48" cy="-28" r="4"/>
      <circle cx="-28" cy="-48" r="4"/>
    </g>

    <!-- Dial Branding -->
    <text x="0" y="-18" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="8" letter-spacing="2">SEIKO</text>
    <text x="0" y="-8" text-anchor="middle" fill="#777777" font-family="monospace" font-size="6" letter-spacing="1">AUTOMATIC</text>

    <!-- Open Heart Balance Wheel Viewport (9 o'clock) -->
    <circle cx="-24" cy="14" r="14" fill="#141414" stroke="#444" stroke-width="1.2"/>
    <circle cx="-24" cy="14" r="9" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.6"/>
    <circle cx="-24" cy="14" r="3" fill="#888"/>

    <!-- Lower Dial Text -->
    <text x="0" y="24" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="6" letter-spacing="1">DIVER'S 100m</text>
    <text x="0" y="32" text-anchor="middle" fill="#666666" font-family="monospace" font-size="5">STEALTH MOD</text>

    <!-- Watch Hands (Hour, Minute, Lollipop Seconds) -->
    <!-- Hour Hand -->
    <polygon points="-3,0 -2,-28 0,-34 2,-28 3,0" fill="#ffffff" filter="url(#lumeGlow)" transform="rotate(-65)"/>
    <!-- Minute Hand -->
    <polygon points="-2.5,0 -1.5,-44 0,-50 1.5,-44 2.5,0" fill="#ffffff" filter="url(#lumeGlow)" transform="rotate(35)"/>
    <!-- Center Pin Cap -->
    <circle cx="0" cy="0" r="4.5" fill="#333" stroke="#fff" stroke-width="1.2"/>
    <!-- Second Hand (Needle) -->
    <line x1="0" y1="14" x2="0" y2="-54" stroke="#ffffff" stroke-width="1" transform="rotate(145)"/>
    <circle cx="0" cy="-36" r="2.5" fill="#ffffff" filter="url(#lumeGlow)" transform="rotate(145)"/>
  </g>

  <!-- Left / Right Specs Labels -->
  <g transform="translate(45, 140)">
    <text x="0" y="0" fill="#666" font-family="monospace" font-size="10">CALIBER:</text>
    <text x="0" y="16" fill="#ccc" font-family="'Inter', sans-serif" font-weight="700" font-size="11">SEIKO NH35A</text>
    <text x="0" y="32" fill="#888" font-family="'Inter', sans-serif" font-size="10">24 JEWELS AUTO</text>
  </g>

  <g transform="translate(485, 140)">
    <text x="0" y="0" fill="#666" font-family="monospace" font-size="10">GLASS &amp; CASE:</text>
    <text x="0" y="16" fill="#ccc" font-family="'Inter', sans-serif" font-weight="700" font-size="11">SAPPHIRE AR</text>
    <text x="0" y="32" fill="#888" font-family="'Inter', sans-serif" font-size="10">316L PVD STEEL</text>
  </g>

  <!-- Footer Tag -->
  <rect x="210" y="295" width="180" height="22" rx="11" fill="#1b1b1b" stroke="#333" stroke-width="1"/>
  <text x="300" y="310" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="1">⌚ МЕХАНІКА З АВТОПІДЗАВОДОМ</text>
</svg>
